[package]
name = "dev-inbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dev_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["time", "sync", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
regex = "1"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications through UNUserNotificationCenter (macOS 27 refuses the legacy API).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSError", "NSBundle", "NSURL", "NSObject", "block2"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }
